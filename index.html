<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DecisionHelper</title>
  <meta http-equiv="refresh" content="1; url=build/WebAssembly_Qt_6_8_3_single_threaded-Debug/index.html">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      margin: 0;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #2196F3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    const candidates = [
      "build/WebAssembly_Qt_6_8_3_single_threaded-Release/index.html",
      "build/WebAssembly_Qt_6_8_3_single_threaded-Debug/index.html"
    ];
    async function redirect() {
      for (const p of candidates) {
        try {
          const res = await fetch(p, { method: "HEAD" });
          if (res.ok) {
            window.location.replace(p);
            return;
          }
        } catch (e) {}
      }
      window.location.replace(candidates[1]);
    }
    redirect();
  </script>
</head>
<body>
  <div class="spinner"></div>
  <p>Loading DecisionHelper...</p>
  <p style="font-size: 13px; color: #888;">If you are not redirected automatically, <a href="build/WebAssembly_Qt_6_8_3_single_threaded-Debug/index.html">click here</a>.</p>
</body>
</html>
